<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadence</title>
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<style>
/* ── Variables ── */
:root {
  --bg:           #f7f5f0;
  --bg-card:      #ffffff;
  --bg-sunken:    #edeae3;
  --ink:          #0f0e0c;
  --ink-mid:      #6b6760;
  --ink-faint:    #b0ada6;
  --accent:       #5c4fff;
  --accent-light: #ede9ff;
  --accent-dark:  #3d31d4;
  --success:      #16a34a;
  --warning:      #d97706;
  --danger:       #dc2626;
  --border:       rgba(15,14,12,0.08);
  --border-mid:   rgba(15,14,12,0.14);
  --shadow-sm:    0 1px 3px rgba(15,14,12,0.08), 0 1px 2px rgba(15,14,12,0.06);
  --shadow-md:    0 4px 16px rgba(15,14,12,0.10), 0 2px 4px rgba(15,14,12,0.06);
  --shadow-lg:    0 20px 48px rgba(15,14,12,0.12), 0 8px 16px rgba(15,14,12,0.08);
}

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Satoshi', system-ui, -apple-system, sans-serif;
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* ── Background layers ── */
#noise-layer {
  position: fixed; inset: 0; z-index: 0;
  width: 100%; height: 100%;
  opacity: 0.025;
  pointer-events: none;
}

#orb {
  position: fixed;
  width: 600px; height: 600px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(92,79,255,0.07) 0%, rgba(92,79,255,0.02) 50%, transparent 72%);
  top: -180px; right: -160px;
  z-index: 0;
  pointer-events: none;
  will-change: transform;
}

/* ── App ── */
#app { position: relative; z-index: 1; min-height: 100%; }

/* ── Sticky header ── */
.app-header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(247,245,240,0.88);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 28px; height: 60px;
}

.wordmark {
  font-family: 'Clash Display', system-ui, sans-serif;
  font-size: 20px; font-weight: 700; color: var(--ink);
  display: inline-flex; align-items: center;
}
.wordmark::after { content: '●'; color: var(--accent); font-size: 9px; margin-left: 3px; margin-top: -8px; }

.header-right { display: flex; align-items: center; gap: 16px; }

.header-skill-pill {
  background: var(--accent); color: #fff;
  font-family: 'Satoshi', sans-serif; font-size: 13px; font-weight: 600;
  padding: 5px 14px; border-radius: 99px;
  max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.header-day { font-size: 13px; color: var(--ink-mid); font-weight: 500; }

.btn-link {
  background: none; border: none;
  font-family: 'Satoshi', sans-serif; font-size: 13px; font-weight: 500;
  color: var(--ink-mid); cursor: pointer; padding: 0;
  transition: color 0.15s; display: inline-flex; align-items: center; gap: 5px;
}
.btn-link:hover { color: var(--ink); }

/* ── Buttons ── */
.btn-primary {
  font-family: 'Satoshi', sans-serif; font-size: 15px; font-weight: 600;
  padding: 14px 28px; border-radius: 12px;
  border: none; background: var(--accent); color: #fff; cursor: pointer;
  box-shadow: 0 4px 16px rgba(92,79,255,0.28);
  transition: background 0.15s, transform 0.15s, box-shadow 0.15s;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.btn-primary:hover:not(:disabled) {
  background: var(--accent-dark); transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(92,79,255,0.38);
}
.btn-primary:active:not(:disabled) { transform: translateY(1px); box-shadow: 0 2px 8px rgba(92,79,255,0.2); }
.btn-primary:disabled { opacity: 0.36; cursor: default; transform: none; box-shadow: none; }

.btn-secondary {
  font-family: 'Satoshi', sans-serif; font-size: 14px; font-weight: 500;
  padding: 11px 20px; border-radius: 12px;
  border: 1px solid var(--border-mid); background: var(--bg-sunken); color: var(--ink);
  cursor: pointer; transition: all 0.15s;
}
.btn-secondary:hover { background: var(--bg-card); box-shadow: var(--shadow-sm); transform: translateY(-1px); }

.btn-pill {
  font-family: 'Satoshi', sans-serif; font-size: 14px; font-weight: 500;
  padding: 10px 20px; border-radius: 99px;
  border: 1.5px solid transparent;
  background: var(--bg-sunken); color: var(--ink-mid);
  cursor: pointer; transition: all 0.15s;
  white-space: nowrap;
}
.btn-pill:hover { border-color: var(--border-mid); color: var(--ink); }
.btn-pill.selected {
  border-color: var(--accent); background: var(--accent-light); color: var(--accent-dark);
}

.btn-back {
  background: none; border: none;
  font-family: 'Satoshi', sans-serif; font-size: 14px; font-weight: 500;
  color: var(--ink-mid); cursor: pointer; padding: 0;
  display: inline-flex; align-items: center; gap: 6px; transition: color 0.15s;
}
.btn-back:hover { color: var(--ink); }

/* ── Cards ── */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: var(--shadow-md), inset 0 1px 0 rgba(255,255,255,0.9);
  transition: box-shadow 0.2s ease, transform 0.2s ease;
}
.card.hoverable:hover {
  box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,0.9);
  transform: translateY(-2px);
}

/* ── Inputs ── */
.input-base {
  width: 100%; background: var(--bg-sunken);
  border: 1.5px solid var(--border-mid);
  border-radius: 12px; color: var(--ink);
  font-family: 'Satoshi', sans-serif; font-size: 15px;
  padding: 14px 16px; outline: none;
  transition: border-color 0.18s, box-shadow 0.18s;
}
.input-base:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
.input-base::placeholder { color: var(--ink-faint); }

/* ── Field label ── */
.field-label {
  font-family: 'Satoshi', sans-serif; font-size: 11px; font-weight: 700;
  color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.12em;
  display: block; margin-bottom: 8px;
}

/* ── Error / feedback boxes ── */
.err-box {
  display: none; align-items: center; gap: 10px;
  background: rgba(220,38,38,0.08); border: 1px solid rgba(220,38,38,0.2);
  border-radius: 10px; padding: 11px 14px;
  font-size: 13px; color: var(--danger);
}
.err-box.show { display: flex; }

/* ── Screen base + transitions ── */
.screen { min-height: 100vh; }

@keyframes sIn  { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
@keyframes sOut { from { opacity:1; } to { opacity:0; } }

.screen-enter { animation: sIn  300ms cubic-bezier(0.2,0.9,0.2,1) both; }
.screen-exit  { animation: sOut 180ms ease-in forwards; pointer-events:none; }

.key-helper { font-size: 13px; color: var(--ink-mid); line-height: 1.6; }
.key-helper a { color: var(--accent); text-decoration: none; }
.key-helper a:hover { text-decoration: underline; }

/* ══════════════════════════════
   SCREEN 1 — HOME
══════════════════════════════ */
.home-body { padding-bottom: 80px; }

.home-hero {
  max-width: 680px; margin: 0 auto;
  padding: 72px 28px 40px; text-align: center;
}

.home-overline {
  font-family: 'Satoshi', sans-serif; font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.16em; color: var(--accent);
  margin-bottom: 18px;
}

.home-headline {
  font-family: 'Clash Display', system-ui, sans-serif;
  font-size: 64px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.0;
  color: var(--ink); margin-bottom: 18px;
}

.home-sub {
  font-size: 18px; color: var(--ink-mid); line-height: 1.65;
  max-width: 460px; margin: 0 auto 36px;
}

.home-cta { font-size: 17px !important; padding: 16px 36px !important; border-radius: 14px !important; }

.trust-row {
  display: flex; align-items: center; justify-content: center;
  flex-wrap: wrap; gap: 6px 18px; margin-top: 20px;
  font-size: 13px; color: var(--ink-faint);
}
.trust-sep { color: var(--border-mid); }

/* Skills grid */
.skills-section { max-width: 680px; margin: 0 auto; padding: 0 28px 40px; }

.section-eyebrow {
  font-family: 'Satoshi', sans-serif; font-size: 12px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-faint);
  margin-bottom: 14px;
}

.skills-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }

.skill-card { padding: 24px; cursor: pointer; }
.skill-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 20px; }

.sc-name {
  font-family: 'Clash Display', system-ui, sans-serif;
  font-size: 22px; font-weight: 600; color: var(--ink); margin-bottom: 6px;
}
.sc-badge {
  display: inline-flex; background: var(--accent-light); color: var(--accent-dark);
  font-family: 'Satoshi', sans-serif; font-size: 11px; font-weight: 700;
  padding: 3px 10px; border-radius: 99px; margin-bottom: 8px;
}
.sc-last { font-size: 13px; color: var(--ink-mid); margin-bottom: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sc-prog { height: 4px; background: var(--bg-sunken); border-radius: 99px; overflow: hidden; }
.sc-prog-fill { height: 100%; background: var(--accent); border-radius: 99px; }
.sc-cta { font-size: 13px; font-weight: 600; color: var(--accent); margin-top: 12px; display: block; }

/* How it works */
.hiw-section { max-width: 680px; margin: 0 auto; padding: 0 28px; }
.hiw-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.hiw-grid-4 { grid-template-columns: repeat(2, 1fr); }

.hiw-card {
  padding: 28px 22px; overflow: hidden; position: relative; cursor: default;
}
.hiw-card:hover { transform: none !important; box-shadow: var(--shadow-md) !important; }

.hiw-key-card {
  background: var(--accent-light) !important;
  border-color: rgba(92,79,255,0.18) !important;
  cursor: default;
}
.hiw-key-card .hiw-num { color: rgba(92,79,255,0.15); }
.hiw-key-card .input-base { background: rgba(255,255,255,0.75); margin: 10px 0 6px; }

.hiw-num {
  font-family: 'Clash Display', system-ui, sans-serif;
  font-size: 72px; font-weight: 700; color: var(--accent-light);
  line-height: 1; margin-bottom: 8px; user-select: none;
}
.hiw-title { font-family: 'Satoshi', sans-serif; font-size: 15px; font-weight: 700; color: var(--ink); margin-bottom: 6px; }
.hiw-desc { font-size: 14px; color: var(--ink-mid); line-height: 1.55; margin-bottom: 2px; }

/* ══════════════════════════════
   SCREEN 2 — CALIBRATE
══════════════════════════════ */
.cal-body { max-width: 600px; margin: 0 auto; padding: 40px 28px 80px; }

.cal-topbar { display: flex; align-items: center; gap: 20px; margin-bottom: 44px; }

.cal-dots { display: flex; gap: 6px; }
.cal-dot {
  width: 7px; height: 7px; border-radius: 99px;
  background: var(--bg-sunken); border: 1.5px solid var(--border-mid);
  transition: all 0.22s ease;
}
.cal-dot.active { width: 22px; background: var(--accent); border-color: var(--accent); }
.cal-dot.done   { background: var(--accent); border-color: var(--accent); }

.cal-q {
  opacity: 0; transform: translateY(24px);
  margin-bottom: 40px;
}
.cal-q.visible {
  opacity: 1; transform: translateY(0);
  transition: opacity 320ms cubic-bezier(0.2,0.9,0.2,1), transform 320ms cubic-bezier(0.2,0.9,0.2,1);
}

.cal-roman { font-family: 'Satoshi', sans-serif; font-style: italic; font-size: 13px; color: var(--accent); display: block; margin-bottom: 6px; }

.cal-q-text {
  font-family: 'Clash Display', system-ui, sans-serif;
  font-size: 32px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.15;
  color: var(--ink); margin-bottom: 22px;
}

/* Underline text input for skill name */
.input-bare {
  font-family: 'Clash Display', system-ui, sans-serif !important;
  font-size: 26px !important; font-weight: 500 !important;
  width: 100%; background: transparent; border: none;
  border-bottom: 2px solid var(--border-mid);
  border-radius: 0; padding: 6px 0; outline: none; color: var(--ink);
  transition: border-color 0.18s;
}
.input-bare:focus { border-bottom-color: var(--accent); }
.input-bare::placeholder { color: var(--ink-faint); }

.pill-group { display: flex; flex-wrap: wrap; gap: 10px; }

.cal-cta-wrap {
  opacity: 0; transform: scale(0.92);
  transition: opacity 250ms ease, transform 250ms ease;
  margin-top: 8px;
  pointer-events: none;
}
.cal-cta-wrap.visible { opacity: 1; transform: scale(1); pointer-events: auto; }

/* ══════════════════════════════
   SCREEN 3 — LOOP
══════════════════════════════ */
.loop-body { max-width: 680px; margin: 0 auto; padding: 32px 28px 80px; }

/* Progress */
.prog-section { margin-bottom: 36px; }
.prog-labels {
  display: flex; justify-content: space-between;
  font-size: 12px; font-weight: 600; color: var(--ink-faint);
  text-transform: uppercase; letter-spacing: 0.06em;
  margin-bottom: 10px;
}
.prog-wrap { position: relative; }
.prog-track {
  height: 8px; background: var(--bg-sunken);
  border-radius: 99px; position: relative; overflow: visible;
}
.prog-fill {
  position: absolute; top: 0; left: 0; height: 100%;
  background: linear-gradient(90deg, var(--accent) 0%, #7c6bff 100%);
  border-radius: 99px;
  box-shadow: 0 0 14px rgba(92,79,255,0.35);
  width: 0%;
  transition: width 700ms cubic-bezier(0.2,0.9,0.2,1);
}
.prog-milestones { position: absolute; inset: 0; pointer-events: none; }
.ms-dot {
  position: absolute; top: 50%; transform: translate(-50%,-50%);
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--bg-card); border: 1.5px solid var(--border-mid);
  z-index: 1;
}
.ms-label {
  position: absolute; top: calc(100% + 8px); transform: translateX(-50%);
  font-size: 10px; color: var(--ink-faint); white-space: nowrap;
  font-weight: 500;
}

/* Move card container */
.mcc {
  position: relative; overflow: hidden;
  margin-bottom: 24px; min-height: 260px;
}

.move-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,0.9);
  padding: 40px;
}

.move-eyebrow {
  font-family: 'Satoshi', sans-serif; font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.14em; color: var(--accent);
  margin-bottom: 4px;
}

.move-num {
  position: absolute; top: 32px; right: 32px;
  background: var(--accent-light); color: var(--accent-dark);
  font-family: 'Satoshi', sans-serif; font-size: 12px; font-weight: 700;
  padding: 4px 12px; border-radius: 99px;
}

.move-title {
  font-family: 'Clash Display', system-ui, sans-serif;
  font-size: 38px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1;
  color: var(--ink); margin-bottom: 14px;
}

.move-rule { width: 36px; height: 2.5px; background: var(--accent); margin-bottom: 16px; border-radius: 2px; }

.move-desc {
  font-family: 'Satoshi', sans-serif; font-size: 17px; color: var(--ink-mid);
  line-height: 1.7; max-width: 500px; margin-bottom: 24px;
}

.move-eta {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: 'Satoshi', sans-serif; font-size: 14px; color: var(--ink-faint);
}

/* Card swap animations */
@keyframes exitLeft  { from {transform:translateX(0);    opacity:1;} to {transform:translateX(-64px); opacity:0;} }
@keyframes enterRight{ from {transform:translateX(64px); opacity:0;} to {transform:translateX(0);     opacity:1;} }

.card-exit  { animation: exitLeft   250ms ease-in  forwards; }
.card-enter { animation: enterRight 320ms ease-out both; }

/* Skeleton */
.move-skel {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px;
  box-shadow: var(--shadow-lg); padding: 40px;
}
.skel-line {
  background: linear-gradient(90deg, var(--bg-sunken) 25%, rgba(255,255,255,0.7) 50%, var(--bg-sunken) 75%);
  background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px;
  margin-bottom: 14px;
}
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
.sk-t  { height: 42px; width: 65%; }
.sk-d1 { height: 17px; width: 100%; }
.sk-d2 { height: 17px; width: 80%; margin-bottom: 24px; }
.sk-e  { height: 20px; width: 130px; border-radius: 99px; }

/* Check-in */
.ci-label { font-size: 14px; color: var(--ink-mid); text-align: center; margin-bottom: 12px; }

.ci-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 16px; }

.btn-ci {
  font-family: 'Satoshi', sans-serif; font-size: 13px; font-weight: 500;
  padding: 10px 16px; border-radius: 99px;
  border: 1px solid var(--border-mid); background: var(--bg-card); color: var(--ink-mid);
  cursor: pointer; transition: all 0.15s;
}
.btn-ci:hover:not(:disabled) { border-color: var(--accent); color: var(--ink); background: var(--accent-light); }
.btn-ci:disabled { opacity: 0.38; cursor: default; }
.btn-ci.tapped { transform: scale(0.94); box-shadow: 0 0 0 3px var(--accent-light); border-color: var(--accent); }

.feedback {
  font-family: 'Satoshi', sans-serif; font-style: italic;
  font-size: 16px; color: var(--accent-dark); text-align: center;
  min-height: 26px; opacity: 0; transition: opacity 0.38s ease;
}
.feedback.show { opacity: 1; }

/* ══════════════════════════════
   SCREEN 4 — HISTORY
══════════════════════════════ */
.hist-body { max-width: 680px; margin: 0 auto; padding: 40px 28px 80px; }

.hist-heading {
  font-family: 'Clash Display', system-ui, sans-serif;
  font-size: 32px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 28px;
}

.hist-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 32px; }

.stat-card { padding: 22px 18px; text-align: center; cursor: default; }
.stat-card:hover { transform: none !important; box-shadow: var(--shadow-md) !important; }
.stat-val { font-family: 'Clash Display', system-ui, sans-serif; font-size: 34px; font-weight: 700; line-height: 1; margin-bottom: 5px; }
.stat-lbl { font-family: 'Satoshi', sans-serif; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-faint); }

.hist-row {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 12px; border-bottom: 1px solid var(--border);
  border-radius: 8px; transition: background 0.12s;
}
.hist-row:hover { background: var(--bg-sunken); }
.hist-day { font-family: 'Satoshi', sans-serif; font-size: 14px; font-weight: 700; color: var(--accent); min-width: 52px; }
.hist-title { font-size: 15px; font-weight: 500; color: var(--ink); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.badge {
  font-family: 'Satoshi', sans-serif; font-size: 11px; font-weight: 700;
  padding: 3px 10px; border-radius: 99px; text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap;
}
.b-done  { background: rgba(22,163,74,0.12);  color: var(--success); }
.b-fast  { background: var(--accent-light);    color: var(--accent-dark); }
.b-long  { background: rgba(217,119,6,0.12);   color: var(--warning); }
.b-stuck { background: rgba(220,38,38,0.12);   color: var(--danger); }
.b-skip  { background: var(--bg-sunken);       color: var(--ink-faint); }

/* ── Responsive ── */
@media (max-width: 580px) {
  .home-headline { font-size: 44px; }
  .hiw-grid { grid-template-columns: 1fr; }
  .move-title { font-size: 28px; }
  .move-card { padding: 28px 24px; }
  .ci-row { gap: 6px; }
  .btn-ci { font-size: 12px; padding: 9px 12px; }
  .hist-stats { grid-template-columns: repeat(3,1fr); gap: 8px; }
  .stat-val { font-size: 26px; }
}

/* ── prefers-reduced-motion ── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

<svg id="noise-layer" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <filter id="nf">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#nf)"/>
</svg>
<div id="orb"></div>
<div id="app"></div>

<script>
'use strict';

/* ══════════════════════════════
   CONSTANTS
══════════════════════════════ */

const SYSTEM_PROMPT = `You are the move engine inside Cadence, an adaptive skill-learning tool.

Your job: generate the SINGLE next learning move for this person. Not a vague direction. Not a concept to think about. A real, concrete, guided instruction they can act on RIGHT NOW without googling anything extra.

WHAT A GOOD MOVE LOOKS LIKE:
- Bad: "Learn about React hooks" — too vague, no action
- Bad: "Explore the concept of promises in JavaScript" — sounds like a textbook
- Good: "Open a new file, write a useEffect hook that console.logs 'mounted' when your component loads, and check that it fires once on mount. Then add a dependency array with an empty [] and confirm it only fires once."
- Good: "Go to your terminal and run: npx create-react-app my-app --template typescript. Wait for it to finish, open the src/App.tsx file, and change the return statement to render your own name in an h1 tag. Save and check localhost:3000."

The move MUST:
1. Start with a verb (Open, Run, Write, Create, Go to, Add, Change, Build, Connect)
2. Name the specific file, tool, command, or URL they need
3. Describe the exact action in enough detail that they do not need to search for anything
4. End with a concrete checkable outcome ("you should see X", "the output will be Y", "you'll know it works when Z")

Adapt to last outcome:
- done: advance to the next logical step, maintain difficulty
- fast: advance AND increase scope/complexity — they are ahead of plan
- long: advance but reduce the scope of the next move — keep it achievable
- stuck: DO NOT advance. Break the stuck move into a smaller sub-step that removes the specific blocker. If they were stuck on "write a function", the next move is "just write the function signature with empty body and make sure it compiles/runs without error." Go one level more granular.
- skip: re-offer the same move with a slightly different framing or entry point. No guilt.

Match their goal:
- "Use it for real" → moves that produce something they could show someone
- "Build a thing" → moves that add a visible feature or output
- "Understand it" → moves that involve a tiny experiment with a clear observable result

Level adjustments:
- Beginner: assume zero context, spell out every step, name every command
- Rusty basics: assume they know the concepts but forgot syntax — give the command/code, brief reminder why
- Want depth: skip the basics, push toward edge cases, performance, patterns, best practices

Tone: direct, warm, like a senior dev pair-programming with you. No preamble, no filler. Just the move.

Output ONLY valid JSON. No markdown. No explanation outside the JSON:
{"title": string (max 5 words, starts with a verb, specific), "description": string (2–4 sentences, concrete enough to act on immediately), "etaMinutes": integer}`;

const FEEDBACK = {
  done:  'Good. The plan holds.',
  fast:  'Ahead of plan. Finish pulled in.',
  long:  'No problem. Finish moved out — still honest.',
  stuck: "Smaller step incoming. Same wall won't stop you twice.",
  skip:  'Reflowed. No guilt. The plan bends to you.'
};

const CHECKINS = [
  { id:'done',  label:'✓ Done' },
  { id:'fast',  label:'⚡ Easy' },
  { id:'long',  label:'⏱ Took longer' },
  { id:'stuck', label:'? Got stuck' },
  { id:'skip',  label:'→ Skipped' }
];

const H2T = { 'Under 3': 21, '3 to 6': 14, '7 or more': 10 };

/* ══════════════════════════════
   STATE & STORAGE
══════════════════════════════ */

let skills = [];
let currentIdx = -1;

const SS = {
  load() { try { return JSON.parse(sessionStorage.getItem('cadence_skills')||'[]'); } catch { return []; } },
  save() { sessionStorage.setItem('cadence_skills', JSON.stringify(skills)); },
  key: () => sessionStorage.getItem('cadence_key')
};

function getSkill()    { return skills[currentIdx]; }
function saveSkill()   { SS.save(); }
function mutate(fn)    { fn(skills[currentIdx]); SS.save(); }

/* ══════════════════════════════
   HELPERS
══════════════════════════════ */

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function pct(day, target) {
  return Math.min(Math.max((day-1)/target*100, 0), 100).toFixed(2);
}

function rm() { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
function hold(ms) { return rm() ? Promise.resolve() : new Promise(r => setTimeout(r, ms)); }

/* ══════════════════════════════
   MOUSE PARALLAX
══════════════════════════════ */

(function() {
  const orb = document.getElementById('orb');
  let tx=0, ty=0, cx=0, cy=0, raf=null;

  document.addEventListener('mousemove', e => {
    tx = (e.clientX/window.innerWidth  - 0.5) * 22;
    ty = (e.clientY/window.innerHeight - 0.5) * 22;
    if (!raf) raf = requestAnimationFrame(tick);
  });

  function tick() {
    cx += (tx - cx) * 0.08;
    cy += (ty - cy) * 0.08;
    orb.style.transform = `translate(${cx.toFixed(2)}px,${cy.toFixed(2)}px)`;
    raf = (Math.abs(tx-cx)+Math.abs(ty-cy) > 0.05) ? requestAnimationFrame(tick) : null;
  }
})();

/* ══════════════════════════════
   SCREEN MANAGEMENT
══════════════════════════════ */

const app = document.getElementById('app');
let activeEl = null;

function showScreen(name, opts={}) {
  if (activeEl) {
    const dying = activeEl;
    dying.classList.add('screen-exit');
    setTimeout(() => dying.remove(), 200);
    activeEl = null;
  }
  setTimeout(() => {
    const el = document.createElement('div');
    el.className = `screen screen-${name} screen-enter`;
    app.appendChild(el);
    activeEl = el;
    SCREENS[name](el, opts);
  }, rm() ? 0 : 130);
}

  clock:`<svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true"><circle cx="6.5" cy="6.5" r="5" stroke="currentColor" stroke-width="1.2"/><path d="M6.5 4v2.5l1.5 1.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>`

function mkHeader(mode, skill) {
  if (mode === 'key') return '';

  const left = (mode === 'loop' && skill)
    ? `<div class="header-skill-pill">${esc(skill.skill)}</div>`
    : `<div class="wordmark">Cadence</div>`;

  const right = (mode === 'loop' && skill)
    ? `<span class="header-day" id="h-day">Day ${skill.day} of ~${skill.target}</span>
       <button class="btn-link" id="h-hist" title="History">${IC.hist} History</button>
       <button class="btn-link" id="h-chkey">Change key</button>`
    : (SS.key() ? `<button class="btn-link" id="h-chkey">Change key</button>` : '');

  return `<header class="app-header"><div>${left}</div><div class="header-right">${right}</div></header>`;
}

function wireHeader(el) {
  const chkey = el.querySelector('#h-chkey');
  if (chkey) chkey.addEventListener('click', () => {
    sessionStorage.removeItem('cadence_key');
    showScreen('home');
  });
  const hist = el.querySelector('#h-hist');
  if (hist) hist.addEventListener('click', () => showScreen('history'));
}

          <div class="card hiw-card"><div class="hiw-num">02</div><div class="hiw-title">Get your move</div><div class="hiw-desc">One concrete action, sized to a single session.</div></div>
          <div class="card hiw-card"><div class="hiw-num">03</div><div class="hiw-title">Check in</div><div class="hiw-desc">Done, stuck, or skipped — the plan bends to reality.</div></div>

        <div class="hiw-grid hiw-grid-4">
          <div class="card hiw-card"><div class="hiw-num">01</div><div class="hiw-title">Name it</div><div class="hiw-desc">Tell us the skill and where you're starting from.</div></div>
          <div class="card hiw-card"><div class="hiw-num">02</div><div class="hiw-title">Get your move</div><div class="hiw-desc">One concrete action, sized to a single session.</div></div>
          <div class="card hiw-card"><div class="hiw-num">03</div><div class="hiw-title">Check in</div><div class="hiw-desc">Done, stuck, or skipped — the plan bends to reality.</div></div>
          <div class="card hiw-card hiw-key-card">
            <div class="hiw-num">04</div>
            <div class="hiw-title">Enter your key and go</div>

SCREENS.calibrate = function(el) {
  el.innerHTML = `
    ${mkHeader('calibrate')}
    <div class="cal-body">
      <div class="cal-topbar">
        <button class="btn-back" id="cb">${IC.back} Back</button>
        <div class="cal-dots">
          <div class="cal-dot active" id="cd0"></div>
          <div class="cal-dot" id="cd1"></div>
          <div class="cal-dot" id="cd2"></div>
          <div class="cal-dot" id="cd3"></div>
        </div>
      </div>
      <div id="cal-qs"></div>
      <div class="cal-cta-wrap" id="cal-cta">
        <button class="btn-primary" id="cal-go" style="width:100%;padding:16px 28px;font-size:16px">Build my plan →</button>
        <div class="err-box" id="cal-err" style="margin-top:12px">
          <span id="cal-err-msg"></span>
          <button class="btn-link" id="cal-retry" style="margin-left:auto">Retry</button>
        </div>
      </div>
    </div>`;

  wireHeader(el);
  el.querySelector('#cb').addEventListener('click', () => showScreen('home'));

  const qc = el.querySelector('#cal-qs');
  const ans = { skill:'', level:'', hours:'', done:'' };
  let step = 0;

  function setDots(active) {
    for (let i=0;i<4;i++) {
      const d = el.querySelector(`#cd${i}`);
      d.classList.toggle('active', i===active);
      d.classList.toggle('done', i<active);
    }
  }

  function addQ(n) {
    setDots(n);
    const div = document.createElement('div');
    div.className = 'cal-q';
    div.id = `q${n}`;

    const romans = ['i','ii','iii','iv'];
    const texts  = ["What's the skill?","Where are you starting?","Hours a week, honestly?","What does done look like?"];

    let body = '';
    if (n===0) {
      body = `<input class="input-bare" id="ski" type="text" placeholder="Rust, oil painting, public speaking…" autocomplete="off">`;
    } else {
      const opts = [
        null,
        [['Beginner','Beginner'],['Rusty basics','Rusty basics'],['Want depth','Want depth']],
        [['Under 3','Under 3'],['3 to 6','3 to 6'],['7 or more','7 or more']],
        [['Understand it','Understand it'],['Build a thing','Build a thing'],['Use it for real','Use it for real']]
      ][n];
      body = `<div class="pill-group">${opts.map(([v,l])=>`<button class="btn-pill" data-v="${v}">${l}</button>`).join('')}</div>`;
    }

    div.innerHTML = `<span class="cal-roman">${romans[n]}</span><div class="cal-q-text">${texts[n]}</div>${body}`;
    qc.appendChild(div);
    requestAnimationFrame(()=>requestAnimationFrame(()=>div.classList.add('visible')));
    setTimeout(()=>div.scrollIntoView({behavior:'smooth',block:'nearest'}), 60);

    if (n===0) {
      const inp = div.querySelector('#ski');
      inp.focus();
      let tmr;
      inp.addEventListener('input', ()=>{
        clearTimeout(tmr);
        if (inp.value.trim()) tmr = setTimeout(()=>advance(0, inp.value.trim()), 900);
      });
      inp.addEventListener('keydown', e=>{
        if (e.key==='Enter' && inp.value.trim()) { clearTimeout(tmr); advance(0, inp.value.trim()); }
      });
    } else {
      div.querySelectorAll('.btn-pill').forEach(b=>{
        b.addEventListener('click', ()=>{
          div.querySelectorAll('.btn-pill').forEach(x=>x.classList.remove('selected'));
          b.classList.add('selected');
          advance(n, b.dataset.v);
        });
      });
    }
  }

  function advance(n, val) {
    const keys = ['skill','level','hours','done'];
    ans[keys[n]] = val;
    if (n===3) {
      const cta = el.querySelector('#cal-cta');
      cta.classList.add('visible');
      setTimeout(()=>cta.scrollIntoView({behavior:'smooth',block:'nearest'}), 60);
      return;
    }
    if (step===n) { step=n+1; addQ(step); }
  }

  async function doBuild() {
    const s = {
      skill: ans.skill, level: ans.level, hoursPerWeek: ans.hours, doneMeans: ans.done,
      day: 1, target: H2T[ans.hours]||14, moveCount: 0, history: [], currentMove: null
    };
    const btn = el.querySelector('#cal-go');
    btn.disabled = true; btn.textContent = 'Building…';
    el.querySelector('#cal-err').classList.remove('show');
    try {
      const move = await callAPI(s, 'start');
      if (!move) return;
      s.currentMove = move; s.moveCount = 1;
      skills.push(s); currentIdx = skills.length-1; SS.save();
      showScreen('loop');
    } catch(e) {
      btn.disabled=false; btn.textContent='Build my plan →';
      el.querySelector('#cal-err').classList.add('show');
      el.querySelector('#cal-err-msg').textContent = e.message||'Something went wrong.';
    }
  }

  el.querySelector('#cal-go').addEventListener('click', doBuild);
  el.querySelector('#cal-retry').addEventListener('click', doBuild);
  addQ(0);
};

SCREENS.loop = function(el) {
  const s = getSkill();
  if (!s) { showScreen('home'); return; }

  el.innerHTML = `
    ${mkHeader('loop', s)}
    <div class="screen-loop">
      <div class="loop-body">
        <div class="prog-section">
          <div class="prog-labels">
            <span>Your journey</span>
            <span id="days-left">~${Math.max(0,s.target-s.day+1)} days to go</span>
          </div>
          <div class="prog-wrap">
            <div class="prog-track">
              <div class="prog-fill" id="pf" style="width:0%;transition:none"></div>
              <div class="prog-milestones">
                <div class="ms-dot" style="left:25%"><div class="ms-label">1/4 there</div></div>
                <div class="ms-dot" style="left:50%"><div class="ms-label">halfway</div></div>
                <div class="ms-dot" style="left:75%"><div class="ms-label">almost</div></div>
              </div>
            </div>
          </div>
        </div>

        <div class="mcc" id="mcc">${mkCard(s.currentMove, s.moveCount||1)}</div>

        <div class="ci-label">How did it go?</div>
        <div class="ci-row" id="cir">
          ${CHECKINS.map(c=>`<button class="btn-ci" data-o="${c.id}">${c.label}</button>`).join('')}
        </div>
        <div class="feedback" id="fb"></div>
        <div class="err-box" id="lerr" style="margin-top:16px">
          <span id="lerr-msg"></span>
          <button class="btn-link" id="lerr-retry" style="margin-left:auto">Retry</button>
        </div>
      </div>
    </div>`;

  wireHeader(el);

  // Animate bar in
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const pf = el.querySelector('#pf');
    if(pf){pf.style.transition='width 700ms cubic-bezier(0.2,0.9,0.2,1)';pf.style.width=pct(s.day,s.target)+'%';}
  }));

  setupCI(el);
};

function mkCard(move, num=1, cls='') {
  if (!move) return mkSkel();
  return `<div class="move-card${cls?' '+cls:''}">
    <div class="move-eyebrow">Your one move</div>
    <div class="move-num">Move #${num}</div>
    <div class="move-title">${esc(move.title)}</div>
    <div class="move-rule"></div>
    <div class="move-desc">${esc(move.description)}</div>
    <div class="move-eta">${IC.clock} About ${move.etaMinutes} minutes</div>
  </div>`;
}

function mkSkel() {
  return `<div class="move-skel">
    <div class="skel-line sk-t"></div>
    <div class="skel-line sk-d1"></div>
    <div class="skel-line sk-d2"></div>
    <div class="skel-line sk-e"></div>
  </div>`;
}

function setupCI(el) {
  let busy = false;
  let lastO = null;

  el.querySelector('#cir').addEventListener('click', async e => {
    const b = e.target.closest('.btn-ci');
    if (!b || busy) return;
    busy = true; lastO = b.dataset.o;
    await doCI(b.dataset.o, el);
    busy = false;
  });

  el.querySelector('#lerr-retry').addEventListener('click', async () => {
    if (busy) return;
    busy = true;
    el.querySelector('#lerr').classList.remove('show');
    const mcc = el.querySelector('#mcc');
    if (mcc) mcc.innerHTML = mkSkel();
    try {
      const s = getSkill();
      const m = await callAPI(s, lastO||'done');
      if (m && el.isConnected) applyCard(el, s, m);
    } catch(e) { loopErr(el, e.message); }
    busy = false;
  });
}

async function doCI(outcome, el) {
  const s = getSkill();

  // Tap animation
  el.querySelectorAll('.btn-ci').forEach(b=>b.disabled=true);
  const tapped = el.querySelector(`[data-o="${outcome}"]`);
  if (tapped) { tapped.classList.add('tapped'); setTimeout(()=>tapped.classList.remove('tapped'),240); }

  // Feedback
  const fb = el.querySelector('#fb');
  fb.textContent = FEEDBACK[outcome]; fb.classList.add('show');

  // Update state
  const title = s.currentMove?.title || '';
  s.history.push({day:s.day, moveTitle:title, outcome});
  if (outcome!=='skip') s.moveCount=(s.moveCount||0)+1;
  if (outcome==='done')       s.day++;
  else if (outcome==='fast')  { s.day++; s.target=Math.max(s.day, s.target-1); }
  else if (outcome==='long')  { s.day++; s.target++; }
  else if (outcome==='stuck') s.day++;
  else if (outcome==='skip')  { s.day++; s.target++; }
  mutate(()=>{});

  // Update header
  const hd = el.querySelector('#h-day');
  if (hd) hd.textContent = `Day ${s.day} of ~${s.target}`;
  const dl = el.querySelector('#days-left');
  if (dl) dl.textContent = `~${Math.max(0,s.target-s.day+1)} days to go`;

  // Completion
  if (s.day > s.target) { await hold(700); showScreen('complete'); return; }

  // Slide out card
  const mcc = el.querySelector('#mcc');
  const old = mcc?.querySelector('.move-card');
  if (old) old.classList.add('card-exit');
  await hold(255);
  if (!el.isConnected) return;
  mcc.innerHTML = mkSkel();

  // Animate bar
  const pf = el.querySelector('#pf');
  if (pf) pf.style.width = pct(s.day,s.target)+'%';

  el.querySelector('#lerr').classList.remove('show');

  let move;
  try {
    move = await callAPI(s, outcome);
  } catch(e) {
    if (!el.isConnected) return;
    loopErr(el, e.message);
    el.querySelectorAll('.btn-ci').forEach(b=>b.disabled=false);
    return;
  }

  if (!move || !el.isConnected) return;
  applyCard(el, s, move);
}

function applyCard(el, s, move) {
  s.currentMove = move; mutate(()=>{});
  const mcc = el.querySelector('#mcc');
  if (mcc) mcc.innerHTML = mkCard(move, s.moveCount, 'card-enter');
  el.querySelectorAll('.btn-ci').forEach(b=>b.disabled=false);
}

function loopErr(el, msg) {
  const e = el.querySelector('#lerr'); if(e) e.classList.add('show');
  const m = el.querySelector('#lerr-msg'); if(m) m.textContent = msg||'Something went wrong.';
}

/* ══════════════════════════════
   SCREEN: COMPLETE
══════════════════════════════ */

SCREENS.complete = function(el) {
  const s = getSkill()||{};
  el.innerHTML = `
    ${mkHeader('home')}
    <div style="display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 60px);padding:24px">
      <div style="max-width:420px;text-align:center">
        <div style="font-family:'Clash Display',system-ui,sans-serif;font-size:26px;font-weight:700;color:var(--ink);margin-bottom:12px">Cadence●</div>
        <h2 style="font-family:'Clash Display',system-ui,sans-serif;font-size:52px;font-weight:700;letter-spacing:-0.02em;line-height:1;color:var(--ink);margin-bottom:20px">Plan complete.</h2>
        <p style="font-size:17px;color:var(--ink-mid);line-height:1.65;margin-bottom:36px">You worked through <strong>${esc(s.skill||'your skill')}</strong>.<br>Real progress — the thing itself.</p>
        <button class="btn-primary" id="c-new" style="width:100%;margin-bottom:12px;font-size:16px;padding:16px">Start a new skill →</button>
        <button class="btn-secondary" id="c-home" style="width:100%">Back to home</button>
      </div>
    </div>`;
  wireHeader(el);
  el.querySelector('#c-new').addEventListener('click', ()=>showScreen('calibrate'));
  el.querySelector('#c-home').addEventListener('click', ()=>showScreen('home'));
};

/* ══════════════════════════════
   SCREEN 4 — HISTORY
══════════════════════════════ */

SCREENS.history = function(el) {
  const s = getSkill();
  if (!s) { showScreen('loop'); return; }

  const done = s.history.filter(h=>h.outcome!=='skip').length;
  const left = Math.max(0, s.target-s.day+1);

  const rows = s.history.length
    ? s.history.slice().reverse().map(h=>`
        <div class="hist-row">
          <div class="hist-day">Day ${h.day}</div>
          <div class="hist-title">${esc(h.moveTitle)}</div>
          <div class="badge b-${h.outcome}">${h.outcome}</div>
        </div>`).join('')
    : `<div style="color:var(--ink-mid);font-size:14px;padding:32px 0;text-align:center">No moves yet — go back and make your first one.</div>`;

  el.innerHTML = `
    ${mkHeader('history')}
    <div class="screen-history">
      <div class="hist-body">
        <button class="btn-back" id="hb" style="margin-bottom:28px">${IC.back} Back to your move</button>
        <h2 class="hist-heading">Your run on ${esc(s.skill)}</h2>
        <div class="hist-stats">
          <div class="card stat-card"><div class="stat-val">${s.day-1}</div><div class="stat-lbl">Days in</div></div>
          <div class="card stat-card"><div class="stat-val">${done}</div><div class="stat-lbl">Moves done</div></div>
          <div class="card stat-card"><div class="stat-val">~${left}</div><div class="stat-lbl">Days left</div></div>
        </div>
        <div class="hist-rows">${rows}</div>
      </div>
    </div>`;

  wireHeader(el);
  el.querySelector('#hb').addEventListener('click', ()=>showScreen('loop'));
};

/* ══════════════════════════════
   API — DIRECT BROWSER FETCH
══════════════════════════════ */

async function callAPI(state, outcome) {
  const key = SS.key();
  const hist = state.history.length
    ? state.history.map(h=>`Day ${h.day} — ${h.moveTitle} — ${h.outcome}`).join('\n')
    : 'None yet — this is the first move.';

  const body = {
    model: 'claude-haiku-4-5',
    max_tokens: 300,
    system: SYSTEM_PROMPT,
    messages: [{role:'user', content:
`Skill: ${state.skill}
Level: ${state.level}
Hours per week: ${state.hoursPerWeek}
What "done" means: ${state.doneMeans}
Current day: ${state.day} of ~${state.target}
Last outcome: ${outcome}
History so far:
${hist}

Give the single next move.`
    }]
  };

  const req = () => fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
      'content-type': 'application/json'
    },
    body: JSON.stringify(body)
  });

  let res;
  try { res = await req(); }
  catch { throw new Error('Network error — check your connection.'); }

  if (res.status===401) {
    sessionStorage.removeItem('cadence_key');
    showScreen('home', {error:'That key didn\'t work — try again.'});
    return null;
  }
  if (!res.ok) throw new Error(`API error ${res.status} — please try again.`);

  const data = await res.json();
  const raw = (data.content?.[0]?.text||'').replace(/```json|```/g,'').trim();

  try { return JSON.parse(raw); }
  catch {
    // Retry once with stronger instruction
    try {
      const r2 = await req();
      const d2 = await r2.json();
      const t2 = (d2.content?.[0]?.text||'').replace(/```json|```/g,'').trim();
      return JSON.parse(t2);
    } catch {
      return {title:'Next small step', description:`Spend 20 focused minutes on the next concrete piece of ${state.skill}.`, etaMinutes:20};
    }
  }
}

   BOOT

(function boot() {
  skills = SS.load();
  showScreen('home');
})();
